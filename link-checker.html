<h1>Amazon Link Checker</h1>

page": "yellow-dial-watches.html", "name": "(unknown)", "url": "https://www.amazon.com/dp/B0DQVJNCBP/?tag=jwwatches-20", "asin": "B0DQVJNCBP"}, {"page": "yellow-dial-watches.html", "name": "(unknown)", "url": "https://www.amazon.com/dp/B0CN1L2J2Q/?tag=jwwatches-20", "asin": "B0CN1L2J2Q"}, {"page": "yellow-dial-watches.html", "name": "(unknown)", "url": "https://www.amazon.com/dp/B0BFJQFZTW/?tag=jwwatches-20", "asin": "B0BFJQFZTW"}];
let results = [];
let running = false;

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function checkLink(item) {
  // Use an image probe on the Amazon product image CDN — fast and doesn't trigger bot detection
  const asin = item.asin;
  return new Promise((resolve) => {
    const img = new Image();
    const timeout = setTimeout(() => {
      img.src = '';
      resolve('broken');
    }, 8000);
    img.onload = () => { clearTimeout(timeout); resolve('ok'); };
    img.onerror = () => {
      clearTimeout(timeout);
      // Image 404 means product doesn't exist; other errors may be CORS
      // Try a second method: fetch the Amazon page via no-cors
      fetch(`https://www.amazon.com/dp/${asin}/`, {mode: 'no-cors', cache: 'no-store'})
        .then(() => resolve('ok'))
        .catch(() => resolve('broken'));
    };
    img.src = `https://images-na.ssl-images-amazon.com/images/P/${asin}.01._SCLZZZZZZZ_.jpg`;
  });
}

async function startCheck() {
  if (running) return;
  running = true;
  document.getElementById('start-btn').disabled = true;
  document.getElementById('summary').style.display = 'flex';
  document.getElementById('results-section').style.display = 'block';
  
  const tbody = document.getElementById('results-body');
  tbody.innerHTML = '';
  results = [];

  let ok = 0, broken = 0;

  for (let i = 0; i < LINKS.length; i++) {
    const item = LINKS[i];
    const pct = Math.round((i / LINKS.length) * 100);
    document.getElementById('progress-bar').style.width = pct + '%';
    document.getElementById('status').textContent = `Checking ${i+1} of ${LINKS.length}: ${item.asin}...`;
    document.getElementById('pending-count').textContent = LINKS.length - i;

    // Add row as checking
    const tr = document.createElement('tr');
    tr.id = 'row-' + i;
    tr.innerHTML = `
      <td><span class="badge checking">Checking…</span></td>
      <td>${item.name || '—'}<br><small style="color:rgba(255,255,255,0.4)">${item.page}</small></td>
      <td>${item.asin}</td>
      <td><a href="${item.url}" target="_blank">Open →</a></td>
    `;
    tbody.insertBefore(tr, tbody.firstChild);

    const status = await checkLink(item);
    results.push({...item, status});

    const badge = tr.querySelector('.badge');
    if (status === 'ok') {
      ok++;
      badge.className = 'badge ok';
      badge.textContent = '✓ OK';
    } else {
      broken++;
      badge.className = 'badge broken';
      badge.textContent = '✗ Broken';
      document.getElementById('download-btn').style.display = 'inline-block';
    }
    document.getElementById('ok-count').textContent = ok;
    document.getElementById('broken-count').textContent = broken;
    document.getElementById('pending-count').textContent = LINKS.length - i - 1;

    await sleep(300); // be polite to Amazon
  }

  document.getElementById('progress-bar').style.width = '100%';
  document.getElementById('status').textContent = `Done! ${ok} working, ${broken} broken out of ${LINKS.length} checked.`;
  document.getElementById('start-btn').disabled = false;
  document.getElementById('start-btn').textContent = '↺ Run Again';
  running = false;
}

function downloadCSV() {
  const broken = results.filter(r => r.status === 'broken');
  const rows = [['Page','Watch Name','ASIN','URL']];
  broken.forEach(r => rows.push([r.page, r.name || '', r.asin, r.url]));
  const csv = rows.map(r => r.map(v => `"${v}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = 'broken-links.csv';
  a.click();
}
